<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - FEMORA</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/na60gFB.png">
<link rel="apple-touch-icon" href="https://i.imgur.com/na60gFB.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #FDFBF7; color: #2C2C2C; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background-image: radial-gradient(circle at 10% 20%, rgba(255, 209, 220, 0.4) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(230, 230, 250, 0.6) 0%, transparent 40%); }
    .box { width: 100%; max-width: 400px; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.2rem; text-align: center; margin-bottom: 2rem; }
    .logo span { color: #D4A5C9; font-style: italic; }
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #8A8A8A; margin-bottom: 0.5rem; font-weight: 600; }
    .input-group input { width: 100%; padding: 1rem; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 1rem; font-size: 1rem; outline: none; }
    .input-group input:focus { border-color: #D4A5C9; }
    
    /* Password eye icon styles */
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 45px; }
    .eye-icon { 
      position: absolute; right: 15px; top: 50%; transform: translateY(-50%); 
      cursor: pointer; color: #8A8A8A; font-size: 1.1rem; 
    }
    
    .btn { width: 100%; padding: 1.1rem; border: none; border-radius: 1rem; background: #2C2C2C; color: #FDFBF7; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 1rem; }
    .btn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">FEMORA<span>.</span></div>
    <div class="input-group"><label>Full Name</label><input type="text" id="name"></div>
    <div class="input-group"><label>Email</label><input type="email" id="email"></div>
    <div class="input-group"><label>Phone</label><input type="tel" id="phone"></div>
    
    <!-- Updated Password Input with Eye Icon -->
    <div class="input-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" id="password">
        <span class="eye-icon" onclick="togglePassword()">👁️</span>
      </div>
    </div>

    <button class="btn" id="btn">Continue</button>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.querySelector('.eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈'; // Hide icon
      } else {
        input.type = 'password';
        icon.textContent = '👁️'; // Show icon
      }
    }

    const API = 'https://femora-backend-sigma.vercel.app';
    document.getElementById('btn').addEventListener('click', async () => {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      
      if(!name || !email || !phone || !password) return alert('Fill all fields');

      const btn = document.getElementById('btn');
      btn.textContent = 'Loading...'; btn.disabled = true;

      const res = await fetch(`${API}/api/signup`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, password })
      });
      const data = await res.json();
      
      if(data.success) {
        localStorage.setItem('tempEmail', email);
        window.location.href = '/upload.html';
      } else {
        alert(data.error); btn.textContent = 'Continue'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
