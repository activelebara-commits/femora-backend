<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - FEMORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #FDFBF7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .box { width: 100%; max-width: 400px; background: #FFF; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 1rem; }
    input { width: 100%; padding: 1rem; border: 1px solid #E5E5E5; border-radius: 1rem; font-size: 1.2rem; text-align: center; letter-spacing: 0.5em; margin-bottom: 1rem; }
    .btn { width: 100%; padding: 1rem; border: none; border-radius: 1rem; background: #2C2C2C; color: #FFF; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Admin Access</div>
    <input type="password" id="pin" placeholder="Enter PIN">
    <button class="btn" onclick="login()">Login</button>
  </div>

  <script>
    const API = 'https://femora-backend-sigma.vercel.app';
    async function login() {
      const pin = document.getElementById('pin').value;
      const res = await fetch(`${API}/api/admin-login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });
      const data = await res.json();
      
      if(data.success) {
        sessionStorage.setItem('isAdmin', 'true');
        window.location.href = '/admin.html';
      } else {
        alert('Invalid PIN');
      }
    }
  </script>
</body>
</html>
