<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting - FEMORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #FDFBF7; color: #2C2C2C; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; background-image: radial-gradient(circle at 90% 80%, rgba(230, 230, 250, 0.6) 0%, transparent 40%); }
    .box { width: 100%; max-width: 400px; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 2rem; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    .badge { display: inline-block; padding: 0.5rem 1rem; background: #E6E6FA; border-radius: 2rem; font-size: 0.8rem; font-weight: 600; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">FEMORA<span style="color:#D4A5C9">.</span></div>
    <div class="icon">⏳</div>
    <h2>Verification Pending</h2>
    <p style="color:#6B6B6B; margin-top:1rem; line-height: 1.6;">Our team is reviewing your profile. You will receive an email once approved.</p>
    <div class="badge">⏱ Usually takes 10–30 minutes</div>
  </div>
</body>
</html>
